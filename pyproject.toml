[build-system]
requires = ["setuptools", "joblib>=1.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "python-abc"
version = "0.3.0"
description = "A python implementation of the ABC Software metric"
readme = "README.md"
requires-python = ">=3.9"
license = "Unlicense"
license-files = ["UNLICENSE"]
authors = [
    {name = "Eoin Noble", email = "eoin@eoinnoble.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.9",
    "Typing :: Typed",
]
dependencies = ["joblib>=1.5.1"]

[project.urls]
HomePage = "https://github.com/eoinnoble/python-abc"

[project.scripts]
python_abc = "python_abc.__main__:main"

[dependency-groups]
test = [
    "pytest (>=8.0.0,<9.0.0)",
]
lint = [
    "ruff (>=0.11.0,<0.12.0)",
    "mypy (>=1.16.0,<1.17.0)",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "pip-tools",
]
